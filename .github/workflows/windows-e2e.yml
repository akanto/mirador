name: Windows e2e

on:
  push:
    branches: [windows-e2e]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs the whole suite as it stands on Windows and reports which specs pass and fail, and how long it all takes.
  survey:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - name: Install Claude Code
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      # The version the Mac and the Linux image run. npm puts an opencode.cmd on PATH, as it does for users who install it so.
      - name: Install opencode
        shell: pwsh
        run: |
          npm install --global @opencode/cli@2.0.27
          npm prefix --global | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & (Join-Path (npm prefix --global) "opencode.cmd") --version
      # As in the unit tests: Git for Windows puts only its cmd folder on PATH, so a user's Windows has no sh, sleep or
      # openssl there; the runner's PATH has them, from Git's other folders and from OpenSSL.
      # Specs that wait for a real reply get it from the owner's model server, on the "haiku" the test hosts choose. The
      # server doesn't serve tool search's tool_reference blocks, and Haiku has Claude Code load MCP tools upfront anyway.
      - name: Run the suite
        shell: pwsh
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.LLM_SERVER_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LLM_SERVER_KEY }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: radiance-qwen3.8-flash-next
          ANTHROPIC_DEFAULT_SONNET_MODEL: radiance-qwen3.8-flash-next
          ANTHROPIC_DEFAULT_OPUS_MODEL: radiance-qwen3.8-flash-next
          ANTHROPIC_SMALL_FAST_MODEL: radiance-qwen3.8-flash-next
          ENABLE_TOOL_SEARCH: "false"
        run: |
          $serverHost = ($env:ANTHROPIC_BASE_URL -as [uri]).Host
          if ($serverHost) { "::add-mask::$serverHost" }
          $modelServer = @($env:ANTHROPIC_AUTH_TOKEN, $env:ANTHROPIC_BASE_URL, $serverHost) | Where-Object { $_ }
          filter Hide-ModelServer { $text = $_; foreach ($secret in $modelServer) { $text = $text.Replace($secret, "REDACTED") }; $text }
          $unixTools = "sh.exe", "sleep.exe", "openssl.exe"
          $env:Path = ($env:Path -split ";" | Where-Object { $folder = $_; $folder -and -not ($unixTools | Where-Object { Test-Path -LiteralPath (Join-Path $folder $_) }) }) -join ";"
          "::group::What the specs run with"
          where.exe git bun node pwsh powershell bash claude opencode
          claude --version
          "::endgroup::"
          $env:PLAYWRIGHT_JSON_OUTPUT_NAME = "survey.json"
          $env:MIRADOR_E2E_KEEP = "1"
          $started = Get-Date
          cmd /c "bunx playwright test --timeout=180000 --global-timeout=6000000 --reporter=list,json > survey-output.txt 2>&1"
          "playwright exit: $LASTEXITCODE, minutes: $([math]::Round(((Get-Date) - $started).TotalMinutes, 1))"
          Get-Content survey-output.txt | Where-Object { $_ -notmatch 'auth\?(token|code)' }
          if (Test-Path survey.json) { (Get-Content -Raw survey.json) -replace 'auth\?(token|code)=[^"\s\\&]*', 'auth?$1=REDACTED' | Hide-ModelServer | Set-Content survey.json }
      # Traces and the kept host folders are left out: they hold the sign-in link, browser tokens and databases. Only their
      # logs go, with auth links and the model server's address and key taken out.
      - name: Collect host logs
        if: always()
        shell: pwsh
        env:
          LLM_SERVER_URL: ${{ secrets.LLM_SERVER_URL }}
          LLM_SERVER_KEY: ${{ secrets.LLM_SERVER_KEY }}
        run: |
          $modelServer = @($env:LLM_SERVER_KEY, $env:LLM_SERVER_URL, ($env:LLM_SERVER_URL -as [uri]).Host) | Where-Object { $_ }
          filter Hide-ModelServer { $text = $_; foreach ($secret in $modelServer) { $text = $text.Replace($secret, "REDACTED") }; $text }
          New-Item -ItemType Directory -Force e2e-logs | Out-Null
          Get-ChildItem -Path $env:TEMP -Directory -Filter "mirador-e2e-*" | ForEach-Object {
            $hostDir = $_
            $logs = @(Get-Item -LiteralPath (Join-Path $hostDir.FullName "host.log") -ErrorAction SilentlyContinue) + @(Get-ChildItem -Path (Join-Path $hostDir.FullName "data\logs") -File -Filter *.log -ErrorAction SilentlyContinue)
            $logs | ForEach-Object {
              $target = Join-Path e2e-logs ($hostDir.Name + "-" + $_.Name)
              Get-Content -LiteralPath $_.FullName | Where-Object { $_ -notmatch 'auth\?(token|code)' } | Hide-ModelServer | Set-Content -LiteralPath $target
            }
          }
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-e2e-survey
          path: |
            survey.json
            e2e-logs/
          retention-days: 7
          if-no-files-found: ignore
